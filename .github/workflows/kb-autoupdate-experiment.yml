# Knowledge auto-update pipeline on GitHub Actions — the fork deployment.
#
# Runs the full pipeline with no cloud credentials while the AWS deployment awaits AppSec
# review. Inference goes through an OpenAI-compatible gateway (KB_INFERENCE_URL + the
# KB_INFERENCE_TOKEN secret). Durable state (fact/source registries, seen sets, pins) lives
# on the kb-state branch and is committed back after every run; each run's raw results are
# archived under runs/<runId>/ on the same branch, which is also where decisions.py finds
# the judge results behind review-brief markers. PRs, review briefs, and the dashboard
# issue all land in this repo via the runner's own GITHUB_TOKEN.
#
# This file lives at .github/workflows/kb-autoupdate-experiment.yml on the default branch;
# the copy under experiments/ is the reviewed source.
name: kb-autoupdate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch holding the pipeline code
        default: feat/kb-autoupdate-pipeline
  schedule:
    - cron: "0 9 * * *"   # daily, 09:00 UTC

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency: kb-autoupdate

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KB_INFERENCE: openai
      KB_INFERENCE_URL: https://bedrock.genli.people.aws.dev/api/v1/chat/completions
      KB_INFERENCE_TOKEN: ${{ secrets.KB_INFERENCE_TOKEN }}
      KB_CHEAP_MODEL: global.anthropic.claude-haiku-4-5-20251001-v1:0
      KB_STRONG_MODEL: global.anthropic.claude-sonnet-5
      KB_SCAN_WORKERS: "4"
      KB_MAX_JUDGE_PER_RUN: "3"
      KB_PR_BASE: main
      # PRs and review briefs go UPSTREAM; branches stay on the fork; the dashboard stays
      # on the fork as operations infrastructure.
      KB_PR_REPO: awslabs/startups
      KB_DASHBOARD_REPO: ${{ github.repository }}
      KB_SKILLS_ROOT: ${{ github.workspace }}/work/migrate/plugins/migration-to-aws/skills
      KB_STATE_FILE: ${{ github.workspace }}/state/kb-state.json
      KB_RUN_ARCHIVE: ${{ github.workspace }}/state/runs
      # A fine-grained PAT scoped to awslabs/startups (PRs + Issues) — gh needs it for the
      # upstream writes. Fork-side git pushes use the checkouts' own credentials.
      GITHUB_TOKEN: ${{ secrets.KB_GITHUB_TOKEN }}
      POC: code/migrate/kb-autoupdate-poc
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'feat/kb-autoupdate-pipeline' }}
          path: code

      - name: Check out work tree (PR base)
        uses: actions/checkout@v5
        with:
          ref: main
          path: work

      - name: Check out state branch
        uses: actions/checkout@v5
        with:
          ref: kb-state
          path: state

      - name: Prepare trees
        run: |
          git -C work fetch origin main
          for t in work state; do
            git -C "$t" config user.name  "kb-autoupdate[bot]"
            git -C "$t" config user.email "kb-autoupdate@users.noreply.github.com"
          done
          echo "KB_RUN_ID=$(date -u +%Y-%m-%dT%H%M%SZ)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install --quiet boto3 httpx beautifulsoup4 lxml defusedxml

      - name: Recheck every registered fact
        run: cd "$POC" && python recheck.py --out results-recheck.json

      - name: Scan sources
        run: cd "$POC" && python scan.py --out results-scan.json

      - name: Judge and apply
        run: |
          cd "$POC"
          python3 - "$KB_MAX_JUDGE_PER_RUN" <<'PY' > hits.txt
          import json, sys
          cap = int(sys.argv[1])
          hits = [h["title"] for h in json.load(open("results-scan.json"))["hits"]]
          print("\n".join(hits[:cap]))
          if len(hits) > cap:
              print(f"DEFERRED {len(hits) - cap} of {len(hits)} hits", file=sys.stderr)
          PY
          apply_failures=0
          while read -r title; do
            [ -z "$title" ] && continue
            out="results-judge-$(printf '%s' "$title" | shasum | cut -c1-10).json"
            python judge.py --hit "$title" --out "$out" || continue
            rc=0
            python apply.py \
              --judge "$out" \
              --repo "$GITHUB_WORKSPACE/work" \
              --commit --push --draft-pr --run-id "$KB_RUN_ID" \
              --base "$KB_PR_BASE" --from-ref "origin/$KB_PR_BASE" \
              --remote origin --pr-repo "$KB_PR_REPO" || rc=$?
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]; then
              python scan.py --mark-handled "$title" || true
            else
              echo "APPLY FAILED (rc=$rc): $title"
              apply_failures=$((apply_failures + 1))
            fi
          done < hits.txt
          [ "$apply_failures" -eq 0 ] || exit 1

      - name: Execute maintainer decisions
        run: cd "$POC" && python decisions.py --repo "$GITHUB_WORKSPACE/work" --pr-repo "$KB_PR_REPO" --base "$KB_PR_BASE"

      - name: Refresh the dashboard issue
        env:
          # The dashboard lives on the fork; the upstream-scoped PAT cannot write it, the
          # runner token can (and can still read the public upstream for the briefs list).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd "$POC" && python dashboard_issue.py --repo-for-issue "$KB_DASHBOARD_REPO" --briefs-repo "$KB_PR_REPO"

      - name: Archive run and commit state
        if: always()
        run: |
          mkdir -p "state/runs/$KB_RUN_ID"
          cp "$POC"/results-*.json "$POC"/*.pr-body.md "$POC"/*.issue-body.md "state/runs/$KB_RUN_ID/" 2>/dev/null || true
          ls -1d state/runs/*/ 2>/dev/null | sort | head -n -30 | xargs -r rm -rf
          cd state
          git add -A
          git diff --cached --quiet && { echo "state unchanged"; exit 0; }
          git commit -q -m "state: run $KB_RUN_ID"
          for i in 1 2 3; do
            git push origin HEAD:kb-state && exit 0
            git pull --rebase origin kb-state
          done
          exit 1

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kb-run-${{ github.run_id }}
          path: |
            code/migrate/kb-autoupdate-poc/results-*.json
            code/migrate/kb-autoupdate-poc/*.pr-body.md
            code/migrate/kb-autoupdate-poc/*.issue-body.md
          if-no-files-found: warn
