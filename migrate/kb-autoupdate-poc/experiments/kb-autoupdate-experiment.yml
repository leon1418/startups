# Zero-AWS experiment: the knowledge pipeline on GitHub Actions + GitHub Models.
#
# No AWS resource is touched. Inference = GitHub Models (free tier, via the runner's own
# GITHUB_TOKEN with `models: read`). State = a throwaway file seeded from
# experiments/gh-models-state-seed.json (4 facts, 1 source, judge cap 1 — sized to stay
# inside the free-tier rate limits). Evidence = a workflow artifact. PRs and review briefs
# land in this repo via the same apply.py contract as the AWS pipeline.
#
# Deliberately skipped in the experiment: decisions.py (needs the S3 run archive),
# dashboard_issue.py (would overwrite the real dashboard with experiment data).
#
# This file lives at .github/workflows/kb-autoupdate-experiment.yml on the default branch;
# the copy under experiments/ is the reviewed source.
name: kb-autoupdate-experiment

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch holding the pipeline code
        default: feat/kb-autoupdate-pipeline

permissions:
  contents: write
  issues: write
  pull-requests: write
  models: read

concurrency: kb-autoupdate-experiment

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KB_INFERENCE: github
      KB_CHEAP_MODEL: openai/gpt-4o-mini
      KB_STRONG_MODEL: openai/gpt-4o
      KB_MAX_JUDGE_PER_RUN: "1"
      KB_PR_BASE: main
      KB_PR_REPO: ${{ github.repository }}
      KB_STATE_FILE: ${{ github.workspace }}/code/migrate/kb-autoupdate-poc/experiments/kb-state.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POC: code/migrate/kb-autoupdate-poc
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: code

      - name: Check out work tree (PR base)
        uses: actions/checkout@v4
        with:
          ref: main
          path: work

      - name: Prepare work tree for pushes
        run: |
          git -C work fetch origin main
          git -C work config user.name  "kb-autoupdate[bot]"
          git -C work config user.email "kb-autoupdate@users.noreply.github.com"

      - name: Install dependencies
        run: pip install --quiet boto3 httpx beautifulsoup4 lxml defusedxml

      - name: Seed experiment state
        run: cp "$POC/experiments/gh-models-state-seed.json" "$KB_STATE_FILE"

      - name: Recheck (4 facts)
        run: cd "$POC" && python recheck.py --out results-recheck.json

      - name: Scan (1 source)
        run: cd "$POC" && python scan.py --out results-scan.json

      - name: Judge and apply (cap 1)
        run: |
          cd "$POC"
          python3 - "$KB_MAX_JUDGE_PER_RUN" <<'PY' > hits.txt
          import json, sys
          cap = int(sys.argv[1])
          hits = [h["title"] for h in json.load(open("results-scan.json"))["hits"]]
          print("\n".join(hits[:cap]))
          if len(hits) > cap:
              print(f"DEFERRED {len(hits) - cap} of {len(hits)} hits", file=sys.stderr)
          PY
          apply_failures=0
          while read -r title; do
            [ -z "$title" ] && continue
            out="results-judge-$(printf '%s' "$title" | shasum | cut -c1-10).json"
            python judge.py --hit "$title" --out "$out" || continue
            rc=0
            python apply.py \
              --judge "$out" \
              --repo "$GITHUB_WORKSPACE/work" \
              --commit --push --draft-pr --run-id "gha-${{ github.run_id }}" \
              --base "$KB_PR_BASE" --from-ref "origin/$KB_PR_BASE" \
              --remote origin --pr-repo "$KB_PR_REPO" || rc=$?
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]; then
              python scan.py --mark-handled "$title" || true
            else
              echo "APPLY FAILED (rc=$rc): $title"
              apply_failures=$((apply_failures + 1))
            fi
          done < hits.txt
          [ "$apply_failures" -eq 0 ] || exit 1

      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-run-${{ github.run_id }}
          path: |
            code/migrate/kb-autoupdate-poc/results-*.json
            code/migrate/kb-autoupdate-poc/*.pr-body.md
            code/migrate/kb-autoupdate-poc/*.issue-body.md
          if-no-files-found: warn
